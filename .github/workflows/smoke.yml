name: Smoke test workers.dev

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Curl checks
        run: |
          set +e
          B=https://blog-worker.zishuowang696.workers.dev
          for p in / /css/style.css /tags /posts/yocto-recipe-hello /register /sitemap.xml; do
            curl -sS -m 30 -o /tmp/body.txt -w "$p -> HTTP %{http_code}\n" "$B$p"
          done
          echo "--- register page markers ---"
          curl -sS -m 30 "$B/register" | grep -oE '创建账号|name="username"' | sort -u
