name: Smoke test workers.dev

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Curl home
        run: |
          set +e
          curl -sS -m 30 -o /tmp/body.txt -w 'HTTP %{http_code} time=%{time_total}s\n' https://blog-worker.zishuowang696.workers.dev/
          echo "--- body head ---"
          head -c 500 /tmp/body.txt
          echo
          echo "--- dns ---"
          getent hosts blog-worker.zishuowang696.workers.dev || true
