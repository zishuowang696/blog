name: Deploy Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      run_seed:
        type: boolean
        description: 首次部署时把 content/archive 种子灌入 D1（可重复执行）
        default: false
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'wrangler.toml'
      - 'migrations/drizzle/**'

permissions:
  contents: read

jobs:
  deploy:
    name: wrangler d1 + deploy
    runs-on: ubuntu-latest
    # 默认关闭：仓库变量 CF_DEPLOY 置为 true 且配好两个 Secrets 后才会执行
    if: vars.CF_DEPLOY == 'true' && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote

      - name: Seed D1（首次或需要重置内容时勾选 run_seed）
        if: inputs.run_seed
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute DB --remote --file=db/seed-d1.sql

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
