name: Sync embedai docs

on:
  workflow_dispatch:
    inputs:
      embedai_ref:
        description: embedai 仓库分支/commit 或 tag
        default: main
        required: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Clone embedai (shallow)
        run: |
          git clone --depth 1 --branch "${{ inputs.embedai_ref || 'main' }}" \
            https://github.com/zishuowang696/embedai.git upstream-embedai

      - name: Run sync script
        run: EMBEDAI_DIR=upstream-embedai bun src/scripts/sync-embedai-docs.ts

      - name: Commit doc snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/upstream content/docs-manifest.json
          if git diff --cached --quiet; then
            echo "无变化，无需提交"
          else
            git commit -m "docs: sync embedai upstream docs"
            git push origin main
          fi
